name: GitHub VPS (ttyd password)

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ttyd curl nodejs npm

      - name: Start Web Terminal (ttyd)
        run: |
          echo "Starting ttyd..."
          ttyd -c dev:1234 -W -p 7681 bash &

      - name: Expose Public URL
        run: |
          npx localtunnel --port 7681
